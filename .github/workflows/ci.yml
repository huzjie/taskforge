name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m compileall -q taskforge
      - name: Run tests
        run: python -m unittest discover -s taskforge/tests -t .
      - name: Doctor smoke
        run: python -m taskforge doctor
      - name: Bench
        run: python -m taskforge bench
