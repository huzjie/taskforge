apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskforge
  labels:
    app: taskforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskforge
  template:
    metadata:
      labels:
        app: taskforge
    spec:
      containers:
        - name: taskforge
          image: taskforge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8787
          env:
            - name: TASKFORGE_BACKEND
              value: "mock"
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: taskforge
spec:
  selector:
    app: taskforge
  ports:
    - port: 8787
      targetPort: 8787
  type: ClusterIP
